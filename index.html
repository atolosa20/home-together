<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Together</title>
<meta name="theme-color" content="#2E6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Sign in / create account -->
<section class="gate" id="authGate" hidden>
  <img class="logo" src="icons/icon-192.png" alt="">
  <h1 data-t="welcome">Home Together</h1>
  <p data-t="welcomeSub"></p>
  <form id="fAuth">
    <label><span data-t="email"></span><input type="email" id="aEmail" autocomplete="email" required></label>
    <label><span data-t="password"></span><span class="pw"><input type="password" id="aPass" autocomplete="current-password" required minlength="6"><button type="button" class="pw-eye" id="aShow" aria-pressed="false"></button></span></label>
    <div class="err" id="aErr" hidden></div>
    <div class="ok-msg" id="aOk" hidden></div>
    <button class="btn" id="aSubmit"></button>
    <button type="button" class="switch" id="aSwitch"></button>
  </form>
  <div class="lang" role="group" aria-label="Language / Idioma" style="align-self:flex-start">
    <button data-lang="en" aria-pressed="false">EN</button><button data-lang="es" aria-pressed="false">ES</button>
  </div>
</section>

<!-- First time: create or join a home -->
<section class="gate" id="setupGate" hidden>
  <img class="logo" src="icons/icon-192.png" alt="">
  <h1 data-t="setupTitle"></h1>
  <p data-t="setupSub"></p>
  <div class="seg" role="group">
    <button type="button" id="segCreate" aria-pressed="true" data-t="createHome"></button>
    <button type="button" id="segJoin" aria-pressed="false" data-t="joinHome"></button>
  </div>
  <form id="fSetup">
    <label><span data-t="yourName"></span><input type="text" id="sName" autocomplete="given-name" required maxlength="30"></label>
    <label id="sHomeWrap"><span data-t="homeNameLbl"></span><input type="text" id="sHome" maxlength="40"></label>
    <label id="sCodeWrap" hidden><span data-t="code"></span><input type="text" id="sCode" autocapitalize="characters" autocomplete="off" maxlength="6" style="text-transform:uppercase;letter-spacing:.15em"></label>
    <div class="err" id="sErr" hidden></div>
    <button class="btn" id="sSubmit"></button>
  </form>
</section>

<!-- The app -->
<div id="app" hidden>
  <div class="wrap">
    <header class="top">
      <div>
        <div class="dateline" id="dateline"></div>
        <h1 class="home-name"><svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4c-1.8 2.3-2.9 4.8-2.9 7.3s1 4.6 2.9 6.7c1.9-2.1 2.9-4.2 2.9-6.7S13.8 6.3 12 4z"/><path d="M12 18c-3.6 0-7.1-2.2-8.6-6.3 3 .2 5.4 1.6 6.9 3.7"/><path d="M12 18c3.6 0 7.1-2.2 8.6-6.3-3 .2-5.4 1.6-6.9 3.7"/><path d="M6 21h12"/></svg><button id="homeName"></button></h1>
      </div>
      <div class="head-right">
        <button class="gear" id="openSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <div class="sync" id="sync"><i></i><span></span></div>
      </div>
    </header>
    <main id="view"></main>
  </div>

  <nav class="tabs" aria-label="Sections">
    <a href="#today" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4c-1.8 2.3-2.9 4.8-2.9 7.3s1 4.6 2.9 6.7c1.9-2.1 2.9-4.2 2.9-6.7S13.8 6.3 12 4z"/><path d="M12 18c-3.6 0-7.1-2.2-8.6-6.3 3 .2 5.4 1.6 6.9 3.7"/><path d="M12 18c3.6 0 7.1-2.2 8.6-6.3-3 .2-5.4 1.6-6.9 3.7"/><path d="M6 21h12"/></svg><span data-t="tabToday"></span></a>
    <a href="#groceries" data-tab="groceries"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.5 11a2 2 0 0 1-2 1.7h-7a2 2 0 0 1-2-1.7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span data-t="tabShop"></span><span class="badge" id="bGroc" hidden></span></a>
    <a href="#agenda" data-tab="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-t="tabAgenda"></span><span class="badge" id="bChores" hidden></span></a>
    <a href="#dogs" data-tab="dogs"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="10" r="2.2"/><circle cx="9.5" cy="5.8" r="2.2"/><circle cx="14.5" cy="5.8" r="2.2"/><circle cx="18.5" cy="10" r="2.2"/><path d="M12 11c-3 0-6.5 4.6-6.5 7.2 0 1.6 1.3 2.3 2.8 2.3 1.4 0 2.4-.8 3.7-.8s2.3.8 3.7.8c1.5 0 2.8-.7 2.8-2.3C18.5 15.6 15 11 12 11z"/></svg><span data-t="tabDogs"></span></a>
    <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg><span data-t="tabHome"></span></a>
  </nav>
</div>

<div class="sheet-bg" id="settings" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="update" id="update" role="status" hidden></div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
